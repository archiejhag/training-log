name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Performance budget — fails the build if the shipped JS/total weight
      # grows past the ceilings in .lighthouserc.cjs, or if accessibility /
      # best-practices regress. See that file for what the numbers are and
      # why the performance *score* itself is only a warning, not a gate.
      - run: npx lhci autorun
